name: GitHub CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '**.yml'
  pull_request:
    branches:
      - master
  release:
    types:
      - released
  workflow_dispatch:

env:
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Release
  PROJECT: NETReactorSlayer.CLI/NETReactorSlayer.CLI.csproj

jobs:
  build-windows:
    name: Build Windows (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: windows-latest
            architecture: x64
            runtime: win-x64
          - runner: windows-11-arm
            architecture: arm64
            runtime: win-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }} --runtime ${{ matrix.runtime }}

      - name: Publish
        run: >-
          dotnet publish ${{ env.PROJECT }}
          --configuration ${{ env.CONFIGURATION }}
          --framework net10.0
          --runtime ${{ matrix.runtime }}
          --self-contained true
          --no-restore
          --output artifacts/NETReactorSlayer.CLI-${{ matrix.runtime }}
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: github.event_name == 'release' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          name: NETReactorSlayer.CLI-${{ matrix.runtime }}
          path: artifacts/NETReactorSlayer.CLI-${{ matrix.runtime }}
          if-no-files-found: error

  build-linux:
    name: Build Linux (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            architecture: x64
            runtime: linux-x64
          - runner: ubuntu-24.04-arm
            architecture: arm64
            runtime: linux-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }} --runtime ${{ matrix.runtime }}

      - name: Publish
        run: >-
          dotnet publish ${{ env.PROJECT }}
          --configuration ${{ env.CONFIGURATION }}
          --framework net10.0
          --runtime ${{ matrix.runtime }}
          --self-contained true
          --no-restore
          --output artifacts/NETReactorSlayer.CLI-${{ matrix.runtime }}
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: github.event_name == 'release' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          name: NETReactorSlayer.CLI-${{ matrix.runtime }}
          path: artifacts/NETReactorSlayer.CLI-${{ matrix.runtime }}
          if-no-files-found: error

  build-macos:
    name: Build macOS (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-14
            architecture: arm64
            runtime: osx-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.PROJECT }}" --runtime ${{ matrix.runtime }}

      - name: Publish
        run: >-
          dotnet publish "${{ env.PROJECT }}"
          --configuration "${{ env.CONFIGURATION }}"
          --framework net10.0
          --runtime ${{ matrix.runtime }}
          --self-contained true
          --no-restore
          --output artifacts/NETReactorSlayer.CLI-${{ matrix.runtime }}
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: github.event_name == 'release' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          name: NETReactorSlayer.CLI-${{ matrix.runtime }}
          path: artifacts/NETReactorSlayer.CLI-${{ matrix.runtime }}
          if-no-files-found: error
